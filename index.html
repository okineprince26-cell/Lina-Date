<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question for Lina ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;overflow:hidden;background:linear-gradient(135deg,#ffd6e7,#fff0f6,#e8d9ff);color:#35152a}.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}.heart{position:absolute;font-size:22px;animation:float 7s linear infinite;opacity:.65}@keyframes float{from{transform:translateY(110vh) rotate(0deg);opacity:0}15%{opacity:.7}to{transform:translateY(-15vh) rotate(360deg);opacity:0}}.card{width:min(92%,560px);padding:42px 28px;text-align:center;border-radius:28px;background:rgba(255,255,255,.84);backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(80,25,70,.18);position:relative;z-index:2}.emoji{font-size:54px}h1{font-size:clamp(27px,7vw,43px);margin:12px 0}p{font-size:18px;line-height:1.6;margin:12px auto;max-width:470px}.name{font-weight:800}.buttons{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:24px}button{border:0;border-radius:999px;padding:15px 25px;font-size:17px;font-weight:700;cursor:pointer;transition:.2s}#yes{background:#e83e79;color:white;box-shadow:0 8px 20px rgba(232,62,121,.3)}#yes:hover{transform:scale(1.06)}#no{background:#eee;color:#444}.small{font-size:14px;opacity:.65;margin-top:22px}.date-box{margin:22px auto 0;padding:18px;border-radius:18px;background:#fff1f6}.field{display:block;text-align:left;margin:12px 0}.field strong{display:block;margin-bottom:7px}select,input{width:100%;padding:13px;border:1px solid #f0bfd2;border-radius:12px;font-size:16px;background:white;color:#35152a}.confirm{background:#35152a;color:white;width:100%;margin-top:8px}.confirm:disabled{opacity:.65}.message{font-size:16px;font-weight:700;min-height:25px}.success{animation:pop .55s ease}@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<main class="card" id="main"><div class="emoji">💌</div><h1>Hey, Lina…</h1><p>There’s something I’ve been wanting to ask you.</p><p class="name">Kwashie Lina Mawuena Ekua,</p><p>Would you go on a date with me? ❤️</p><div class="buttons"><button id="yes">YES ❤️</button><button id="no">NO 😅</button></div><p class="small">No pressure — just answer honestly 😊</p></main>
<script>
const main=document.getElementById('main');
document.getElementById('no').addEventListener('click',()=>{main.innerHTML='<div class="success"><div class="emoji">❤️</div><h1>No worries 😊</h1><p>Thanks for being honest, Lina.</p><p class="small">I appreciate your answer.</p></div>';});
document.getElementById('yes').addEventListener('click',()=>{
main.innerHTML=`<div class="success"><div class="emoji">🥰💖🎉</div><h1>Yaaay!</h1><p>Now for the fun part, Lina! 💕</p><p>Choose the kind of date you’d enjoy and when you’d like to go.</p><div class="date-box"><label class="field"><strong>What kind of date? 😊</strong><select id="dateType"><option value="">Choose one</option><option>🍦 Ice cream date</option><option>🍕 Pizza / food date</option><option>🎬 Movie date</option><option>🌅 Beach / sunset date</option><option>☕ Café date</option><option>🎮 Games / fun date</option><option>🚶 Walk & talk date</option><option>💡 You choose!</option></select></label><label class="field"><strong>What day would you like?</strong><input id="dateDay" type="date"></label><label class="field"><strong>What time works for you?</strong><input id="dateTime" type="time"></label><button class="confirm" id="confirm">That’s my choice 💌</button><p class="message" id="message"></p></div></div>`;
const dateDay=document.getElementById('dateDay');const t=new Date();dateDay.min=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
document.getElementById('confirm').addEventListener('click',async()=>{const type=document.getElementById('dateType').value,day=dateDay.value,time=document.getElementById('dateTime').value,message=document.getElementById('message'),button=document.getElementById('confirm');if(!type||!day||!time){message.textContent='Please choose the date type, day and time ❤️';return}button.disabled=true;button.textContent='Sending... 💌';const data=new FormData();data.append('date_type',type);data.append('date',day);data.append('time',time);try{const r=await fetch('https://formspree.io/f/moeqrpdq',{method:'POST',body:data,headers:{Accept:'application/json'}});if(!r.ok)throw Error();const prettyDay=new Date(day+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});const prettyTime=new Date('1970-01-01T'+time).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});message.innerHTML='Sent successfully! 🥰💌<br>'+type+'<br>'+prettyDay+' at '+prettyTime+' ❤️';button.textContent='Sent! ❤️';}catch(e){button.disabled=false;button.textContent='That’s my choice 💌';message.textContent='Something went wrong. Please try again.'}});for(let i=0;i<35;i++)setTimeout(makeHeart,i*45);});
function makeHeart(){const h=document.createElement('div');h.className='heart';h.textContent=['❤️','💕','💖','💗','💘'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.animationDuration=(4+Math.random()*5)+'s';h.style.fontSize=(16+Math.random()*22)+'px';document.getElementById('hearts').appendChild(h);setTimeout(()=>h.remove(),9000)}setInterval(makeHeart,700);
</script></body></html>
